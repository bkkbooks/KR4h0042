body:
  text: 回文類聚巻二宋桑世昌撰山樹高鳥鳴悲泉水深鯉魚肥空倉雀常苦飢吏人婦會夫稀出門望見白衣謂當是而更非還入門中心悲北上堂西入階急機絞杼聲催長歎息當語誰君有行妾念之出有日還無期結巾帶長相思君忘妾未知之妾忘君罪當治妾有行宜知之黄者金白者玉高者山下者谷姓者蘇字伯玉人才多智謀足家居長安身在蜀何惜馬蹄歸不數羊肉千斤酒百斛令君馬肥麥與粟今時人知四足與其書不能讀當從中央周四角鞶鑑圖敘上元二載嵗次乙亥十有一月庚午朔七日丙子予將之交趾旅次南海有好事者以轉輪鈎枝八花鑑銘示予云當今之才婦人作也觀其藻麗反覆文字縈迴句讀曲屈韻諧高雅有陳規起諷之意可以作鑑前烈輝暎将來者也昔孔詩十興不遺衛姜江篇擬古無隔班媛葢以超俊穎拔同符君子者矣嗚呼何勒非戒何述非才風律苟存士女何筭聊撫鏡以長想遂援筆而作序太原王勃撰跋元和十三載二月八日予為中書舍人翰林學士夜直禁中奏進旨檢事因開前庫東閣於架上閲古今撰集凡數百家偶於王勃集中巻末獲此鑑圗并序愛玩久之翌日遂自摸寫貯於箱箧寳厯二年乃命随軍潘𤣥敏繪於縑素傳諸好事者太原令狐楚記君承皇詔安邉戌讀起至願放兒夫及早還止囘文類聚巻二

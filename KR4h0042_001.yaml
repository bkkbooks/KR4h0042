body:
  text: 乾隆四十六年十一月初六日内閣奉上諭昨閲四庫館進呈書有朱存孝編輯回文類聚補遺一種内載美人八詠詩詞意媟狎有乖雅正夫詩以温柔敦厚為教孔子不刪鄭衛所以示刺示戒也故三百篇之㫖一言蔽以無邪即美人香草以喻君子亦當原本風雅歸諸麗則所謂托興遥深語在此而意在彼也自玉臺新詠以後唐人韓偓軰務作綺麗之詞號香奩體漸入浮靡尤而效之者詩格更為卑下今美人八詠内所列麗華髪等詩毫無寄託輒取俗傳鄙䙝之語曲為描寫無論詩固不工即其編造題目不知何所証據朕輯四庫全書當採詩文之有闗世道人心者若此等詩句豈可以體近香奩概行採録所有美人八詠詩著即行撤出至此外各種詩集内有似此者亦著該總裁督同總校分校等詳細檢查一併撤去以示朕釐正詩體崇尚雅醇之至意欽此

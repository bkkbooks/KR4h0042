body:
  text: 囘文類聚補遺長洲朱存孝續補昌黎公云佛者西域之一法耳後漢時流入中國上古未嘗有也世人惑其降福之說紛然是務至于奴隸之輩固不足怪何王公卿相之輩讀書知古之人亦奉之不敢稍惰也古之事佛者莫如梁武觀其國敗身亡貽譏後世似亦可以為鑒而奉之者一若未知豈其心之冥頑不靈迨下愚之不若歟古逹磨真性頌及太宗囘文千首雖有巧思終為賊道何堪入于書籍然而前盲久經増入故不復斥去仍附于此以為往鑒云春日雪萬首唐人絶句内錄出五絶潘孟陽春梅雜落雪發樹幾花開真須盡興飲仁里願同來和前張薦遲遲日氣暖漫漫雪天春知君欲醉飲思見此交親春日雪酬潘侍郎權徳輿酒桮春醉好飛雪晚庭閒久憶同前賞中秋對逺山曉行五律錄明詩統内出張豫源殘月落溪灣逺行客路還寒鴉宿古樹靜水咽空山巒翠露深淺嶺雲分曲彎丹霞映赤日曉霽愛躋攀四時四首薛濤春花朶幾枝柔傍砌栁絲千縷細搖風霞雲半嶺西斜日月上孤村一樹松夏凉囘翠簟氷人冷齒沁清泉夏月寒香篆裊風青縷縷紙牕明月白團團秋蘆雪覆汀秋水白栁風凋樹晚山蒼孤幃客夢驚空館獨雁征書寄逺鄉冬風捲雪篷寒罷釣月輝霜柝冷敲城濃香酒泛霞杯滿淡影梅横紙帳清絶句髙青丘風簾一燭對殘花薄霧寒籠翠袖紗空院别愁驚破夢東闌井樹夜啼鴉夜坐臞仙籠煙逺樹見昏黄懶起鈎簾空夜長紅落墜飛驚鳥宿松生月色竹生涼訪友不遇明詩統内録出張旴江紅林半照夕陽斜晚徑行來歸路遐空訪幽人無渡覔野田飛鳥宿平沙題青山白雲圖七律臞仙秋雲白處亂山青石澗横橋小草亭流瀨漱寒鏘玉珮翠巒含秀吐金精鳩鳴野樹疎煙淡雁過髙峯落月明樓上不詩無興遣逺天連水碧澄澄書懷叠字體紛紛雨竹翠森森㸃㸃風花落綠陰貧恨苦吟窮寞寞亂愁牽斷夢沈沈昏昏嶺隔重重信渺渺江如寸寸心因有事情閒黙黙我於疎拙老駸駸夜宿江館有序丘瓊山嵗庚午歸至金陵寓新河客邸鄉友馮元吉誦宋人周明老龜山囘文詩命予兩和其韻以夜宿江館為題明老詩用意曲折命辭瀏亮信為難及矣但其中潮浪浦泉波水等字太多不免重複既曰綠水連天而又有雲接海之句則一意而兩出矣當漁舟釣月之時又安得紅霞暎日乎潮生海岸兩崖傾落月江楓暎火明橋透白波流水逺屋連紅樹帶霜清迢迢漏盡寒更曉片片雲收夜雨晴遙望楚天江渺渺茭蒲盡處落鴻輕牡丹二首以下十一首明詩統内錄出張豫源花浮月夜静飛神妙出天工奪畫真斜葉趂風搖翅蝶艷姿嫌酒病心人霞翻麗質晴烘日露浥微香暖涴塵家世古稱應獨魏花飄未盡占芳春悠悠日轉九囘腸怨入遙波碧草芳流水似情君行薄㫁雲如夢妾心傷愁生嫩臉花増暈淚濕嫣腮粉膩香樓滿月光清夜永紬衾半擁臥空床蜨何出光天晴趂影輕飄粉伴結長欄石砌隂眠栩栩驚秋露滴翅雙雙暎水池臨煙含瘦影梅牕小夢入寒枝梨院深憐却春心花盡撲翩翩幾隊逐園林菩薩蠻秋思丘瓊山予㓜時嘗讀朱文公劉静修文集俱有菩薩蠻囘文詞惜其隨句倒讀不免意複不如至尾讀囘為妙已曽以邨居為題作一闋矣後失其稿閒中復戲作此云紗窗碧透横斜影月光寒處空幃冷香炷細燒檀沈沈正夜闌更深方困睡倦極生愁思含情感寂寥何處别魂銷擬織婦閨怨二首湯若士梅題逺色春歸得遲鄉瘴嶺過愁客孤影雁囘斜峯寒逼翠紗牕殘抛錦室織急還催織錦官當夕情啼斷望河明還生赦泣人天望雙成錦匹孤鸞悵獨泣見誰憐流人苦瘴烟生親還棄杼鴛配闗河戍逺心天未知人道赦來時囘文類聚補遺

body:
  text: 囘文類聚序囘文類聚四巻乃宋臣桑世昌澤卿所纂後明人張之象𤣥超復加增訂披閲之次似覺𤣥超之所增訂者雜亂無緒是以將彼舊増并予所習見之什纂為續集附於巻後重鋟諸木因題於簡端曰靖節陶公有云竒文共欣賞盖以文之竒者不忍獨得故必期共人欣賞而後快如璇璣一圖非文之竒者乎字如碁置按誦成章字不數百詩幾千首何物女郎以錦心織成錦字令千古騷流不能卒讀天才耶仙才耶雖仿其製者代不乏人類不能出其規範然集中所録諸圖及其餘詩詞皆各有其妙足以竝傳間有瑕瑜不掩亦存之以俟大方鑒别可也存孝椎魯無文與騷雅之道相逺其偶涉及於此者亦陶公共欣賞之意夫康熙戊子五月望日玉山牧豎朱存孝囘文類聚原序詩苑云囘文始於竇滔妻反覆皆可成章舊為二體今合為一止兩韻者謂之囘文而舉一字皆成讀者謂之反覆又上官儀曰凡詩對有八其七曰囘文對情親因得意得意逐情親是也自爾或四言或六言或唐律或短語既極其工且流而為樂章盖情詞交通妙均造化此文之所以為無窮也淮海桑世昌

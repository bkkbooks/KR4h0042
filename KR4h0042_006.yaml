body:
  text: 回文類聚卷三宋桑世昌撰四言以下古詩賀道慶陽春艷曲麗錦誇文傷情織怨長路懷君惜别同心膺填思悄碧鳳香殘金屏露曉入夢迢迢抽詞軋軋泣寄回波詩緘去札春遊五言枝分栁塞北葉暗榆關東垂條逐絮轉落蕊散花叢池蓮照曉月幔錦拂朝風低吹雜綸羽薄粉艷妝紅離情隔逺道難結深閨中五言齊王融靜煙臨碧樹殘雪背晴樓冷天侵極戍寒月帶行舟後園作斜峰繞徑曲聳石帶山連花餘拂戲鳥樹密隱鳴蟬和湘東王後園梁簡文帝枝雲間石峰脈水浸山岸池清戲鵠聚樹秋飛葉散又邵陵王蕭綸燭花臨靜夜香氣入重幃曲度聞歌逺繁絃覺舞遲又庾信旱蓮生竭鑊嫩菊養秋潾滿池留浴鷺分橋上戲人又定襄侯危臺出岫迥曲澗上橋斜池蓮隱弱芰徑篠落藤花六言青山映雪含思碧草抽煙繫晴屏香夢愁月落棹蘭吟苦風清零珠淚紅軫促慘雲娥翠杯停聽君唱我離恨聲悲心悽骨驚山居七言戴光乂犂鋤闊地燒侵雲焰猛衝巖迸鹿羣鼙鼓靜時長霸國戰爭無地感明君啼猿響樹寒山碧宿鳥喧巢夜霧曛梯嶮上巖緣路去院僧敲磬曉來聞曉起即事寄皮襲美陸龜蒙平波落月吟間景暗幌浮煙思起人清露曉垂花謝半逺風微動蕙抽新城荒上處樵童小石蘚分來宿鷺馴晴寺野尋同去好古碑苔字細書勻和陸秀才曉起皮日休孤煙曉起初原曲碎樹微分半浪中湖後釣筒移夜雨竹傍眠几側晨風圖梅帶潤輕沾墨畫蘚經蒸半失紅無事有杯持永日共君唯好隱牆東絶句五言紆川小徑緣溪緑低簷傍樹隂好風秋入眼清月夜窺牀四時四首梅窗春晝永春庭邃雙飛燕隔簾袖隨簾捲翠時見玉纎纎夏曲澗跳珠碎叢山疊翠濃竹新敷影薄間看倚枝笻秋小雨涼添夜蘭芬潤襲衣曉屏山曲曲長若夢思歸冬曲徑穿叢密香清為客來玉梢梢外雪苔古暈疏梅因小兒學琴終夜不寐作朝老陳子髙鳴鶴操音清興幽發性情聽琴愛夜半明月上殘更客懷逺山雲夢斷長路客愁新殘漏悲鐘急香車碾暗塵無題半山王安石碧蕪平野曠黃菊晚村深客倦留酣飲身間纍苦吟夢長隨永漏吟苦雜疏鐘動蓋荷風徑霑裳菊露濃迸目川魚躍開雲嶺鳥翻徑斜荒草惡臺廢冶花繁客懷律泊雁鳴深渚收霞落晚川柝隨風斂陳樓映月低弦漠漠汀帆轉幽幽岸火燃壑危通細路溝曲繞平田暮春六言絶朝老陳子髙纎纎亂草平灘冉冉雲歸逺山簾捲堂空日永鳥啼花落春殘晚眺七言絶體此首神智東坡蘇軾長亭短景無人畫老大橫拖瘦竹笻回首斷雲斜日暮曲江倒蘸側山峯記夢十二月二十五日大雪始晴夢人以雪水烹小團茶使美人歌以飲余夢中為作回文詩覺而記其一句云亂點餘花唾碧衫意用飛燕唾花事也乃續之為二絶句云􅋳顔玉碗捧纎纎亂點餘花唾碧衫歌咽水雲凝靜院夢驚松雪落空巖又空花落盡酒傾缸日上山融雪漲江紅焙淺甌新火活龍團小碾鬬晴窗咏梅茹芝翁東溪小步晚煙隨玉點花疏竹外枝風襲袖香清滿徑匆匆好處恨來遲戲成松隱曹勛春光曉看如殘夢院靜宜兼竹影疏新處觸時佳意在夜寒猶怯枕衾孤即事醒菴王卿月花落滿林春寂寂亂紅流水逺飄香鴉栖已合暮雲碧敘日看山空斷腸秋江寫望梅忩寒江暮泊小舟輕白鷺棲煙叢葦鳴寬望逺空浮湛碧老蟾驚玉㺯秋清西湖戲書二首蜿蜿翠麓秋煙漲灔灧金波夜月澄樽酒具時隨興遣景多逢處曲欄憑又雲巢望斷望西湖竹護梅藏隱士居芬草緑深春盎盎客來同攬一山孤春望絲絲栁翠連雲幕點點鷗輕漾晚波時事無心隨興逺日長間處理衣蓑春晝朝老陳子髙悠悠亂片花空舞冉冉輕絲晴晝長樓下怯寒香袖薄破愁春酌濁醪香春夜徐子禮斜光月映紗窗小美蔭雲連翠竹髙花露染成香地暖隔簾輕吹晚騷騷四時四首春隨齋徐權風吹細浪低田麥雨過初分淺水秧紅樹半開桃臉嫩緑波深映栁絲長夏林垂紫李玉成蹊水映紅榴石近溪深棟雙雙飛燕語隂槐緑樹萬蟬嘶秋紅飄亂葉樹連枝雨著疏花菊繞籬蓬轉恨多饒白髮鴻歸數處寄新詩冬飛花雪片落梅殘興發歌樓酒量寬磯石釣魚觀凍手衣蓑緑映暮江寒奉和司封使君春日之作律伯原朱長文佳景更同民共樂俊髦皆集盛飛觴花隨客醉還成句栁贈人行欲斷腸斜月上時霞散錦暖風來處寢凝香華年惜過須心賞富貴叢身逼鬢霜春日湖上書事虛齋桑正國李昭亮供奉為唱時龍太初秦少遊以次和者已二十二人矣諸公末後方示以詩軸似欲見窘因用回文體作一篇答之正讀繼前韻倒讀次後篇巵傾好酒逢時盛早遇春融媚景天龜暖戲挨初緑草燕飛輕拂乍晴煙遲遲晝影花籠檻郁郁香風蝶舞筵眉似栁開眸似水怡情自愛賞湖邊會課乾明寺悠悠意得自疏通寂地因居樂性空幽思曉風清迫枕靜聽寒雨細霑桐修莖竹韻澄簫玉緑影松垂亂鬢蓬儔侣好邀同此適搜吟得到幾匆匆夏日同少遊諸友登樓即事情間共悅良朋好溽暑消來過雨時萍水逺流青點小栁堤橫瞑翠絲垂輕煙晚透疏林迥嫩冉芳迎皎日遲清思廓然欣賞地瞰觀遙閣靜聮詩即席次君禮年兄韻太虛秦觀大父與太虛先生同里閈且同科甲最相厚善翰墨多失於兵燼不特此詩而已先公嘗記誦云是時同集者數人惟太虛不數刻而就坐客皆歎其敏君禮大父字也情舒喜面山浮翠袖滿薰風涼透時萍碎錦鱗金網舉影差簾燕玉鈎垂輕輕篆鼎凝香細欵欵方壺轉漏遲清興此來同約久趣多深意古人詩秋日收兵獻鍾侍郎茹芝翁強兵義勇威嚴令化靖由來不戰征疆境復時歸馬健鼓鼙休處亂雲輕霜凝積恨懷邊戍月落衝寒夜上城黃葉樹頭風凜凜碧波江逺路平平題龜山明老周知微潮隨暗浪雪山傾逺浦漁舟釣月明橋對寺門松徑小檻當泉眼石波清迢迢緑樹江天曉靄靄紅霞海日晴遙望四邊雲接水碧峯千點數鷗一作帆輕宿龜山次韻朝老陳子高潮回浪濺細沙傾岸栁平波映眼明橋接短亭連野迥艇橫長笛帶風清迢迢翠草寒煙暝隱隱疏林暮靄晴遙見疊峰清淺黛客心傷處碧雲輕曉起北山程俱霜林一望極空寒曉鼓催人覺夢殘黃霧帶秋江渺渺徑風翻影露漙漙香飄引篆新添火髮密勝簪慢整冠狂拙懶便惟少事興來間借逺山看冬夜李若璞蒼蒼夜色雲天逺葉落風林噪亂鴉香篆暖煙濃結穗暗窗寒雪密飄花琅琅翠竹幽香碎耿耿青燈孤影斜忘纍俗情添興雅晚眠獨酌滿甌茶次韻吳叔廉山村詩許存我田繞青山好住家短籬疏圃接丘麻煙村逺近栖鴉亂竹岸髙低飛鷺斜泉噴石間巖湧雪霧浮堤外栁吹花連雲碧色秋光冷眠犢黃昏草長芽偶書隨齋徐瓘明中悟理造忱誠性覺通真見即行生不生來空是境有無有處化為城榮枯現夢因緣想色相求心妄執情名與實亡都在道盲聾苦學漫營營回文類聚卷三

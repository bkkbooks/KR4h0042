body:
  text: 回文類聚卷一宋桑世昌撰璇璣圖敘前秦苻堅時秦州刺史扶風竇滔妻蘇氏陳留令武功蘇道質第三女也名蕙字若蘭智識精明儀容秀麗謙默自守不求顯揚年十六歸于竇氏滔甚敬之然蘇氏性近於急頗傷嫉妒滔字連波右將軍于真之孫朗之第二子也神風偉秀該通經史允文允武時論髙之苻堅委以心膂之任備歷顯職皆有政聞遷秦州刺史以忤㫖謫戍燉煌㑹堅克晉襄陽慮有危逼藉滔才略詔拜安南將軍留鎮襄陽初滔有寵姬趙陽臺歌舞之妙無出其右滔置之别所蘇氏知之求而獲焉苦加箠辱滔深以為憾陽臺又専伺蘇氏之短讒毁交至滔益忿蘇氏蘇氏時年二十一及滔將鎮襄陽邀蘇氏同往蘇氏忿之不與偕行乃携陽臺之任絶蘇氏音問蘇氏悔恨自傷因織錦為回文五綵相宣瑩心輝目縱廣八寸題詩二百餘首計八百餘言縱橫反覆皆為文章其文㸃畫無闕才情之妙超今邁古名曰璇璣圖然讀者不能悉通蘇氏笑曰徘徊宛轉自為語言非我佳人莫之能解遂發蒼頭齎至襄陽滔覽之感其悱惻因送陽臺之關中而具車從盛禮邀迎蘇氏歸于漢南恩好愈重蘇氏所著文詞五千餘言屬隋季喪亂文字散落追求弗獲而獨錦字回文盛傳于世朕聽政之暇留心墳典散帙之次偶見斯圖因述若蘭之多才復美連波之悔過遂製此記聊以示將來也如意元年五月一日大周天冊金輪皇帝製讀圖內詩括例依五色所分章讀之仁智至慘傷倫匹至榆桑人賤至聖皇春陽至殊方欽岑至如何已上七言四十句每句為一首每首反讀之計八十首詩風至表𤣥仁賢至凋松光顔至虎龍日往至寄傾已上五言十六句以每句反讀之成三十二首周南至相追年時至無差讒佞至未形牽辜至伯禽已上四言二十四首作二句分讀就成一篇寧自至勞形懷憂至何寃念是至何如悼思至者誰詩情至終始已上四言前四首以每句反讀後一首每句反讀成十首嗟歎至為榮凶頑至為基遊西至摧傷神明至雁歸已上三言十二首反讀成二十四首佞因至舊新南鄭至遺身舊間至佞臣遺哀至南音已上七言凡起頭退一字反讀之成四首廂挑至基津嗟中至春親春衰至嗟仁基自至廂琴已上七言自角退一字斜讀之成四首再叙回文詩圖古無悉通者豫因究璇璣之義如日星之左右行天故布為經緯由中旋外以旁循四旁於其交㑹皆契韻句巡環反覆窈窕縱橫各能妙暢又原五采相宣之說分色以開其篇章其在經緯者始於璣蘇詩始四字其在節㑹者右旋而出隨其所至各成章什外經則始於仁真至於音深中經自欽深至於身殷內經自詩情至於終始皆循方回文者也四角之方如仁真欽心四韻成章而回文者也至其經緯之圖者隨色自分則外之四角窈窕成文而文皆六言也四旁者相對成文而文皆六言也及交手成文而文皆四言也在中之四角者一例橫讀而四言在中之四旁者隨向橫讀而五言惟璇璣平氏四字不入章句觀其宛轉反覆皆才思精深融徹如契自然蓋騷人才子所難豈必女工之尤哉詩編載馳史美班扇才女専靜用志不分雖皆擅名此為精贍者也聊隨分篇掇其一隅以為三隅之反代久傳訛頗有誤字亦輒澄改一二其他闕謬不欲以意定之雖未能盡達元思抑庶幾不為滯塞云李公麟題經緯始於璣蘇詩始四字璣明則改知識深峩嵯峻巖幽岑欽所感想忘荒淫心堂空惟思詠和音詩興感逺殊浮沈華英翳曜潜陽林羅網經涯重淵深峩嵯峻巖幽岑欽蘇作興感昭恨神辜罪天離問舊新霜氷齊潔志精純望誰思想懷所親凡三色讀不可回文外經仁智懷德聖虞唐真妙顯華重榮章臣賢惟聖配英皇倫匹離飄浮江湘回讀傷慘懷慕增憂心堂空思惟詠和音藏摧悲聲發西秦商絃激楚流清琴中經欽岑幽巖峻嵯峨深淵重涯經網羅林陽潜曜翳英華沈浮異遊頽流沙回讀何如將情纒憂殷多患生艱惟苦身加兼愁悴少精神遐幽曠逺離鳳麟內經詩情明顯怨義興理辭麗作此端無終始回讀始終無端作此麗辭理興義怨顯明情詩四方之角仁智懷德聖虞唐真志篤終誓穹蒼欽所感想忘淫荒心憂增慕懷慘傷回讀四角之間窈窕成文嗟歎懷所離經遐曠路傷中情家無君房幃清華飭容朗鏡明回讀四角在中者一例橫讀念是咎愆誰為獨居賤女懷歎鄙賤何如反讀窈窕成文愆咎是念誰為獨居歎懷女賤鄙賤何如四旁相對成文文皆六言讒人作亂闈庭奸凶害我忠貞禍原消受難明所得滋極驕盈四旁隨向橫讀而成五言寒嵗識凋松真物知終始顔衰改華容仁賢别行士反讀窈窕成文士行别賢仁容華改衰顔始終知物貞松雕識嵗寒交手成文文皆四言讒佞奸凶害我忠貞禍因所恃滋極驕盈反讀用色分章止舉一隅餘皆做此橫用色嗟歎懷所離經遐曠路傷中情十二字用粉紅家無君房幃清華飾容朗鏡明用緑葩粉光珠耀英多思感誰為榮用白周風興自后妃樊楚厲節中闈周楚二字用黃外十字用絲長歎不能奮飛雙發歌我衮衣長雙二字用黃外十字用粉紅華觀冶容為誰宫羽同聲相追華宫二字用黃外十字用青已上依此順讀成章直用色庭幃亂作人明難受膚原用緑榮苟不義姬城傾在戒后用粉紅熒猶炎盛興形未在謹深用青已上作兩句各添下字倒讀成章恩感顔寧孜孜傷情名君在時夢想勞形用粉紅順讀龍旗容衣虎雕飾繡八字用緑橫用色奸佞讒人作亂闈庭所因禍原膚受難明用黃右舉此為例餘可悉通元祐三年九月工部何公過麴院見僕書几有此驚曰昨日於屯田陳侯所觀書唐真本圖宜皆可求一見果得出示凡六幅右三為若蘭所居重樓復屋户牖間各作著思練絲織錦遣使處左三幅為竇滔歸第外為車馬相迎次女妓坐大氍毺合樂其間樓閣對飲處又見圖中近上作逺水紅橋竇臨髙列騎擁旌旄以望橋之西氊車從數騎排引見滔盛禮迎蘇圖中近下左書武后序右寫詩圖徐視果有淡色分其篇章正與此同乃知人心不甚相逺而尤可怪矣青紅緑旋所之方皆不少差蓋理之所在陰陽五行色味莫不相假況情識之運宜自冥合也元豐四年四月趙郡李公麟伯時再題又五色讀法四圍縱橫初行八行十五草二草九行及仁嗟斜至春親廓琴斜至基津以朱畫其形如交接讀法此色凡九圖其餘四色色各一圖共詩三千七百五十二首四隅嗟情至英多遊桑至長愁神飛至悲春凶慈至持從縱橫皆六字以墨畫正面妃闈至蕤悲移陂至資辭縱六字橫十三字庭闈至防萌身我至惟新縱十三字橫六字以青畫中方正面龍旗至麗充衰情至暮世縱四字橫五字兩旁寒嵗至行士詩風至微𤣥縱五字橫四字以紫畫中方四隅思情至側夢嬰漫至若我愆居至賤鄙懷悲至戚知縱橫皆四字又中縱各五字詩情至顯怨端比至麗辭橫各五字詩始至無端怨義至理辭空中心圖始平蘇氏詩心九字以黃畫蘇蕙織錦回文及今已久所以欲見其彩色宛然一如蕙之手著者甚為難得八月草日駕幸翠微殿賞桂詔令賦詩見御案所置一幅五色相宣讀之易明因照式記之以志不忘至道元年十一月六日廣慧夫人書又敘蘇蕙織錦回文詩所傳舊矣故少常沈公復傳其畫繇是若蘭之才益著然其詩回旋書之讀者惟曉外繞七言至其中方則漫弗可考矣若沈公之傳亦謂辭句脫略讀不成文殊不知此詩織成本五色相宣因以别三四五六七言之異後人流傳不復施采故迷其句讀非辭句之脫略也政和初豫在洛陽於居士王晉玉許得唐程士南效此詩并申誠之釋而後曉然是詩也初不舛脫蓋沈公未嘗見此本耳然申誠所釋但依士南之設色其七言數火其色反黃四言數金其色反緑於五行為弗協意蘇氏詩圖之色為不爾今因冠詩于畫遂别而正之三四五六七言之詩各隨其行而為之色觀者見其色則詩之言數可知已至于士南之文既有釋者則傳采自從其舊而因書于卷末云國初錢鎮州惟治嘗有寶子垂綬連環之詩亦錦文之遺範而世罕傳故聊附左以資書雋言鯖之餘味焉七年九月二十七日㑹稽黃集長孺父書於山陽襄華堂其所載采色與五色讀法同故不再録跋錢鎮州回文後錢鎮州詩雖未脫五季餘韻然回旋讀之故自娓娓可觀題者多云寶子弗知何物以豫考之乃迦葉之香罏生有金華華內乃有金臺即臺為寶子則知寶子乃香罏耳亦可為此詩但圜若重規然豈漢丁緩被中之製乎題璇璣圖後山谷黃庭堅千詩織就回文錦如此陽臺暮雨何亦有英靈蘇蕙子只無悔過竇連波擬題竇滔妻織錦圖送人太虛秦觀悲風鳴葉秋宵凉絲寒縈手淚殘妝微燭窺人愁斷腸機翻雲錦妙成章題織錦圖東坡蘇軾余少時見一江南本其後有題詩十餘首皆奇絶宛轉過於蘇氏之作逺甚今獨記其三絶春晚落花餘碧草夜凉低月半枯桐人隨雁逺城邊暮雨映疏簾繡閣空紅手素絲千字錦故人新曲九回腸風吹栁絮愁縈骨淚灑縑書恨見郎羞看一首回文錦錦似文君别恨深頭白自吟悲賦客斷腸愁是斷絃琴題織錦圖太虛秦觀蘇子瞻記江南所題詩本不全豫嘗見之記其五絶今以補子瞻之遺紅窗小泣低聲怨永絶春風斗帳空中酒落花飛絮亂曉鶯啼破夢匆匆風一作寒稀草露如郎薄幸亂花飛似妾情多歸鴻見處揮珠淚語燕聞時斂翠蛾琴絃斷續愁兼恨嶺水分西流復東深院小扉紅日落繡窗閒倚更誰同參橫霽色天沈水鳥宿寒枝竹鎖煙衾惹舊香清夜半淚凝殘燭畫堂前寒信霜風秋葉黃冷燈殘月照空牀看君寄意傳文錦字字愁縈惹斷腸再次上韻三絶東坡蘇軾春機滿織回文錦粉淚揮殘露井桐人逺寄情書字小栁絲低日晚庭空紅箋短寫空深恨錦句新翻欲斷腸風葉落殘驚夢蝶戍邊回雁寄情郎羞雲斂慘傷春莫細縷詩成織意深頭伴枕屏山掩恨日昏塵暗玉窗琴璇璣圖考異璇璣圖士夫家所藏類不同有前序而無凡例者十常八九故艱於句讀且復差舛豫嘗參考訂證幾數十處其文頗備但有合兩存者如自成文章與自為語言滋極而作恣極舊邦而作舊鄉昭景而為照景者皆在可取又松陵雜體詩序云晉傅咸有反覆回文詩反覆其文者以示憂心展轉也悠悠逺邁我獨㷀㷀是也由是反覆興焉溫嶠有回文虛言詩云寧神靜泊損有崇亡由是回文興焉今世皆推本蘇氏而不及二子蓋蘇亦亦晉人詩苑所謂舊有二體則恐别有所自合而為一則當始於蘇也嘗按晉列女傳云滔苻堅時為秦州刺史被徙流沙蘇氏思之織錦回文以贈滔宛轉循環讀之詞甚悽惋則又與武后所序不協蓋厯時寖久疑信相傳無足多怪近於友人王守正處見一本兼著人物乃治平中太常少卿沈立將漕河朔於東都陳安期家所得古本唐文宣所製畫筆絶精命工模􅒽廣為橫軸且云詞句脫略讀不成文僅見梗概其後有東坡及孔毅甫秦太虛跋語坡則三詩元豐二年七月十二日書孔則五詩四年九月十七日題秦則一詩元祐戊辰正月十四日汝南蠧魚閣所記皆今所刋者但五詩以補子瞻之遺平時多見淮海集中初不以為出于毅甫也而少游跋乃云蘇孔二公所載八絶雖極新奇然與圖上詩體不類逺甚疑是唐人擬作往嵗過關山雙木驛壁間有題云悲風鳴葉愁宵凉云云亦稱蘇氏織錦圖詩未知其果然否此跋本集無由是推之則太虛一絶非其所擬五詩乃得於孔氏秋愁二字又小不同曽不百年而矛盾如此因具載云回文類聚卷一

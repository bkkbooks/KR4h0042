body:
  text: 回文類聚總集類提要臣等謹案回文類聚四巻補遺一巻宋桑世昌編世昌蘭亭考已著録考劉勰文心雕龍曰回文所興則道原為始梅庚註謂原當作慶宋賀道慶也盖其時璇璣圖詩未出故勰云然世昌以蘓蕙時代在前故用為託始且繪蕙像於巻首以明剏造之功其説未確考藝文類聚載曹植鏡銘八字囬環讀之無不成文實在蕙前乃不標以為始是亦少疎又蘓伯玉妻盤中詩據滄浪詩話自玉臺新詠以外别無出典舊本俱在不聞有圖此書繪一圓圖莫知所本考原詩末句稱當從中央周四角則實方盤而非圓盤所圖殆亦妄也惟是詠歌漸盛工巧日増詩家既開此一途不可竟廢録而存之亦足以資博洽是書之末有世昌自跋稱至道御製登載巻首此本無之殆傳寫佚脱歟其補遺一巻則國朝康熙中蘓州朱存孝所采兼及明人然如明典故中所載回文詩三十圖在耳目前者即已不收則所漏亦多矣姑附存以備參考云耳乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:a0444b7f63a94148fa40917fa136ad7f97a1ff18629a7ead2ff622cf5d0bab95

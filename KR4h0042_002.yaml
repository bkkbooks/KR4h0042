body:
  text: 回文類聚總集類提要臣等謹案回文類聚四卷補遺一卷宋桑世昌編世昌蘭亭考已著録考劉協文心雕龍曰回文所興則道原為始梅庚注謂原當作慶宋賀道慶也蓋其時璇璣圖詩未出故協云然世昌以蘇蕙時代在前故用為託始且繪蕙像於卷首以明創造之功其說未確考藝文類聚載曹植鏡銘八字回環讀之無不成文實在蕙前乃不標以為始是亦少疏又蘇伯玉妻盤中詩據滄浪詩話自玉臺新詠以外别無出典舊本俱在不聞有圖此書繪一圓圖莫知所本考原詩末句稱當從中央周四角則實方盤而非圓盤所圖殆亦妄也惟是詠歌漸盛工巧日增詩家既開此一途不可竟廢録而存之亦足以資博洽是書之末有世昌自跋稱至道御製登載卷首此本無之殆傳寫佚脫歟其補遺一卷則國朝康熙中蘇州朱存孝所采兼及明人然如明典故中所載回文詩三十圖在耳目前者即已不收則所漏亦多矣姑附存以備參考云耳乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:65b275b8a8ccf120c6e54680eb8ff1adfb997b0ed0f151c5dc467f8d21cca579
